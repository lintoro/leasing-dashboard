<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>系統登入 | 專櫃營運與招商戰情室</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap');
    
    :root {
      --primary-navy: #1E2761;
      --secondary-blue: #CADCFC;
      --bg-dark: #1a224a;
      --card-bg: #212c60;
      --card-border: #36458d;
      --accent-highlight: #4d7cfe;
    }

    body {
      font-family: 'Inter', 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-dark);
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login-card {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      box-shadow: 0 10px 30px rgba(12, 17, 48, 0.5);
    }
  </style>
</head>
<body class="p-4 selection:bg-blue-500 selection:text-white">

  <div class="w-full max-w-md login-card rounded-2xl p-6 sm:p-8 space-y-6 relative overflow-hidden">
    <!-- 頂部品牌裝飾 -->
    <div class="flex items-center gap-3 border-b border-[#36458d] pb-5">
      <div class="w-11 h-11 rounded-xl bg-[#CADCFC] text-[#1E2761] flex items-center justify-center shadow font-bold shrink-0">
        <i data-lucide="store" class="w-6 h-6"></i>
      </div>
      <div>
        <h1 class="text-lg font-bold text-white tracking-tight flex items-center gap-2">
          專櫃營運與招商戰情室
        </h1>
        <p class="text-xs text-[#CADCFC]/80 font-medium">商場核心決策支援系統 • 身分認證登入</p>
      </div>
    </div>

    <!-- 訊息提示條 -->
    <div id="alert-box" class="hidden rounded-xl p-3 text-xs font-medium flex items-start gap-2 transition-all">
      <i id="alert-icon" data-lucide="alert-circle" class="w-4 h-4 shrink-0 mt-0.5"></i>
      <span id="alert-msg"></span>
    </div>

    <!-- 登入表單 -->
    <form id="login-form" onsubmit="handleLogin(event)" class="space-y-4">
      <div>
        <label for="emp-id" class="block text-xs font-bold text-[#CADCFC] mb-1.5 flex items-center gap-1.5">
          <i data-lucide="badge-check" class="w-3.5 h-3.5"></i> 人員公務工號 (Employee ID)
        </label>
        <div class="relative">
          <input type="text" id="emp-id" required autofocus autocomplete="username" placeholder="例：A0123"
                 class="w-full bg-[#161e46] text-white placeholder-slate-400 text-sm font-semibold rounded-xl pl-3.5 pr-3 h-[42px] border border-[#36458d] focus:border-[#4d7cfe] focus:ring-1 focus:ring-[#4d7cfe] focus:outline-none transition uppercase">
        </div>
      </div>

      <div>
        <label for="password" class="block text-xs font-bold text-[#CADCFC] mb-1.5 flex items-center gap-1.5">
          <i data-lucide="lock" class="w-3.5 h-3.5"></i> 系統密碼 (Password)
        </label>
        <div class="relative">
          <input type="password" id="password" required autocomplete="current-password" placeholder="••••••••"
                 class="w-full bg-[#161e46] text-white placeholder-slate-400 text-sm font-semibold rounded-xl pl-3.5 pr-10 h-[42px] border border-[#36458d] focus:border-[#4d7cfe] focus:ring-1 focus:ring-[#4d7cfe] focus:outline-none transition">
          <button type="button" onclick="togglePasswordVisibility()" class="absolute right-3 top-2.5 text-slate-400 hover:text-white transition">
            <i id="eye-icon" data-lucide="eye" class="w-4 h-4"></i>
          </button>
        </div>
        <div class="mt-1.5 flex justify-between items-center text-[11px] text-slate-400">
          <span>預設初始密碼為 000000</span>
          <span class="text-slate-400 hover:text-[#CADCFC] cursor-pointer" onclick="showAlert('忘記密碼或帳號鎖定，請直接聯繫系統管理員協助重設解鎖。', 'info')">忘記密碼？</span>
        </div>
      </div>

      <button type="submit" id="submit-btn"
              class="w-full h-[44px] bg-[#4d7cfe] hover:bg-blue-600 active:scale-[0.98] text-white font-bold rounded-xl transition flex items-center justify-center gap-2 shadow-lg shadow-blue-500/20 text-sm mt-2">
        <i data-lucide="log-in" class="w-4 h-4"></i>
        <span>安全登入</span>
      </button>
    </form>

    <!-- 底部切換區 -->
    <div class="pt-2 border-t border-[#36458d]/70 flex items-center justify-between text-xs">
      <span class="text-slate-400">尚未開通帳號？</span>
      <a href="javascript:void(0)" onclick="navigateTo('register')" class="text-[#CADCFC] hover:text-white font-bold flex items-center gap-1 transition">
        <span>提出使用申請</span>
        <i data-lucide="arrow-right" class="w-3.5 h-3.5"></i>
      </a>
    </div>
  </div>

  <script>
    // 初始化 Lucide 圖標
    lucide.createIcons();

    function togglePasswordVisibility() {
      const pwdInput = document.getElementById('password');
      const eyeIcon = document.getElementById('eye-icon');
      if (pwdInput.type === 'password') {
        pwdInput.type = 'text';
        eyeIcon.setAttribute('data-lucide', 'eye-off');
      } else {
        pwdInput.type = 'password';
        eyeIcon.setAttribute('data-lucide', 'eye');
      }
      lucide.createIcons();
    }

    function showAlert(message, type = 'error') {
      const box = document.getElementById('alert-box');
      const msg = document.getElementById('alert-msg');
      const icon = document.getElementById('alert-icon');
      
      box.className = 'rounded-xl p-3 text-xs font-medium flex items-start gap-2 transition-all ' + 
        (type === 'error' ? 'bg-rose-500/20 text-rose-300 border border-rose-500/30' :
         type === 'success' ? 'bg-emerald-500/20 text-emerald-300 border border-emerald-500/30' :
         'bg-blue-500/20 text-blue-200 border border-blue-500/30');

      icon.setAttribute('data-lucide', type === 'error' ? 'alert-circle' : type === 'success' ? 'check-circle-2' : 'info');
      msg.innerText = message;
      box.classList.remove('hidden');
      lucide.createIcons();
    }

    function navigateTo(page) {
      if (window.google && google.script && google.script.run) {
        google.script.run.withSuccessHandler(function(url) {
          const targetUrl = url + '?page=' + page;
          if (window.top) {
            window.top.location.href = targetUrl;
          } else {
            window.location.href = targetUrl;
          }
        }).getScriptUrl();
      } else {
        const urlParams = new URLSearchParams(window.location.search);
        urlParams.set('page', page);
        window.location.search = urlParams.toString();
      }
    }

    function handleLogin(e) {
      e.preventDefault();
      const empId = document.getElementById('emp-id').value.trim();
      const password = document.getElementById('password').value.trim();
      const submitBtn = document.getElementById('submit-btn');

      if (!empId || !password) {
        showAlert('請輸入工號與密碼');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerHTML = '<svg class="animate-spin -ml-1 mr-2 h-4 w-4 text-white" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> 驗證認證中...';

      if (window.google && google.script && google.script.run) {
        google.script.run
          .withSuccessHandler(function(res) {
            submitBtn.disabled = false;
            submitBtn.innerHTML = '<i data-lucide="log-in" class="w-4 h-4"></i> <span>安全登入</span>';
            lucide.createIcons();

            if (res.success) {
              // 存入 LocalStorage
              localStorage.setItem('LEASING_AUTH_TOKEN', res.token);
              localStorage.setItem('LEASING_USER_ROLE', res.role);
              localStorage.setItem('LEASING_USER_EMPID', res.empId);
              localStorage.setItem('LEASING_USER_NAME', res.name);

              showAlert(res.message || '登入成功，導向中...', 'success');

              // 若被強制修改密碼
              if (res.forceChangePwd) {
                setTimeout(function() {
                  navigateTo('changepwd');
                }, 500);
              } else {
                setTimeout(function() {
                  navigateTo(res.role === 'admin' ? 'admin' : 'dashboard');
                }, 500);
              }
            } else {
              showAlert(res.message || '登入失敗');
            }
          })
          .withFailureHandler(function(err) {
            submitBtn.disabled = false;
            submitBtn.innerHTML = '<i data-lucide="log-in" class="w-4 h-4"></i> <span>安全登入</span>';
            lucide.createIcons();
            showAlert('伺服器連線異常: ' + (err.message || err));
          })
          .gasLogin(empId, password);
      } else {
        // 地端純展示測試模式
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<i data-lucide="log-in" class="w-4 h-4"></i> <span>安全登入</span>';
        lucide.createIcons();
        showAlert('地端展示模式：模擬登入成功', 'success');
        localStorage.setItem('LEASING_AUTH_TOKEN', 'DEMO_TOKEN_123');
        localStorage.setItem('LEASING_USER_ROLE', 'admin');
        localStorage.setItem('LEASING_USER_EMPID', empId || 'DEMO01');
        localStorage.setItem('LEASING_USER_NAME', '開發管理者');
        setTimeout(() => navigateTo('dashboard'), 800);
      }
    }
  </script>
</body>
</html>
